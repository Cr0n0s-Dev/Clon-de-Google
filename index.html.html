<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador con redirección a Google</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #f4f6f9;
      color: #1f2937;
    }

    .search-container {
      width: 100%;
      max-width: 520px;
      padding: 2rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 1.25rem;
      font-size: 1.5rem;
    }

    .search-form {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.7rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #2563eb;
      color: #ffffff;
      transition: background-color 0.2s, transform 0.05s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background-color: #0f766e;
    }

    button.secondary:hover {
      background-color: #115e59;
    }
  </style>
</head>
<body>
  <main class="search-container">
    <h1>Buscador</h1>

    <form id="searchForm" class="search-form">
      <input
        id="searchInput"
        type="text"
        placeholder="Escribe lo que deseas buscar..."
        autocomplete="off"
      />

      <div class="buttons">
        <button type="submit" id="btnSearch">Buscar en Google</button>
        <button type="button" id="btnSecondary" class="secondary">Buscar ahora</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const buttons = document.querySelectorAll("button");

    function redirectToGoogle() {
      const query = input.value.trim();

      // Evita redirigir si el campo está vacío
      if (!query) {
        input.focus();
        return;
      }

      // Codifica espacios y caracteres especiales (ej. "hybridge education" -> "hybridge+education")
      const encodedQuery = encodeURIComponent(query).replace(/%20/g, "+");
      const googleUrl = `https://www.google.com/search?q=${encodedQuery}`;

      window.location.href = googleUrl;
    }

    // Cubre el envío del formulario (incluyendo presionar Enter en el input o clic en botón submit)
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      redirectToGoogle();
    });

    // Cubre el clic en cualquiera de los botones de la página
    buttons.forEach((btn) => {
      btn.addEventListener("click", (event) => {
        // Si el botón es type="submit", el evento submit ya se encargará
        if (btn.type !== "submit") {
          event.preventDefault();
          redirectToGoogle();
        }
      });
    });
  </script>
</body>
</html>
